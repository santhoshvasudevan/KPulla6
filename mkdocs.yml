    - Cached market data: concepts/cached-market-data.md
    - Portfolio performance: concepts/portfolio-performance.md
    - Metric Sheet: concepts/metric-sheet.md
    - Mutual funds: concepts/mutual-funds.md
    - Cash ledger: concepts/cash-ledger.md
