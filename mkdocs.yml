    - Refresh prices, FX, benchmarks, and NAVs: how-to/refresh-market-cache.md
    - Back up and restore the database: how-to/backup-restore-database.md
    - Add a backend API endpoint: how-to/add-backend-api-endpoint.md
    - Add a frontend page: how-to/add-frontend-page.md
    - Investigate dashboard performance: how-to/investigate-dashboard-performance.md
