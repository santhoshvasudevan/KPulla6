# MkDocs Material — Diátaxis documentation site for KPulla6.
# Serve: make docs-serve  |  Build: make docs-build  |  Check: make docs-check
site_name: "KPulla6 Docs"
site_description: Local-first portfolio tracker — tutorials, concepts, API reference, and workflows
site_url: "http://docs.kpulla6.com/"
copyright: Copyright &copy; KPulla6 contributors

repo_url: https://github.com/santhoshvasudevan/KPulla6
repo_name: santhoshvasudevan/KPulla6
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
dev_addr: "127.0.0.1:8002"
strict: false

exclude_docs: |
  README.md

validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/overview.md
    - Quickstart run locally: getting-started/quickstart.md
    - Login and first use: getting-started/login-and-first-use.md
    - Common commands: getting-started/common-commands.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Add your first portfolio: tutorials/add-first-portfolio.md
    - Import stock transactions: tutorials/import-stock-transactions.md
    - Add mutual fund transactions: tutorials/add-mutual-fund-transactions.md
    - Refresh market data: tutorials/refresh-market-data.md
    - Read the dashboard: tutorials/read-the-dashboard.md
  - How-to Guides:
